<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)">
<title>식단 메뉴</title>
<style>
  :root{
    --bg:#f5f5f7;
    --panel:#ffffff;
    --line:#e6e6ea;
    --txt:#1b1b1f;
    --dim:#8a8a91;
    --shadow:0 1px 2px rgba(0,0,0,.05);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-t:env(safe-area-inset-top, 0px);

    --c-soup-bg:#fff2e8; --c-soup-line:#ffd3b0; --c-soup-txt:#a1471a; --c-soup-key:#ff7a30;
    --c-kim-bg:#ffeef0;  --c-kim-line:#ffc6cd;  --c-kim-txt:#a3243a;  --c-kim-key:#f0455e;
    --c-side-bg:#eaf7ee; --c-side-line:#bde5c9; --c-side-txt:#1e6b3a; --c-side-key:#2ea35c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111114;
      --panel:#1b1b1f;
      --line:#2c2c33;
      --txt:#f0f0f2;
      --dim:#8b8b93;
      --shadow:none;

      --c-soup-bg:#3a2314; --c-soup-line:#5e3a20; --c-soup-txt:#ffb887; --c-soup-key:#ff8a45;
      --c-kim-bg:#3a1720;  --c-kim-line:#5e2632;  --c-kim-txt:#ff9daa;  --c-kim-key:#f4586f;
      --c-side-bg:#12321f; --c-side-line:#215035; --c-side-txt:#8ee0a8; --c-side-key:#37b76a;
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",
                "Noto Sans KR",Roboto,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    overscroll-behavior-y:none;
  }

  /* ── 상단 고정 영역 ───────────────────────────── */
  header{
    position:sticky; top:0; z-index:10;
    padding:calc(var(--safe-t) + 12px) 14px 10px;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  @supports not (background: color-mix(in srgb, red 50%, blue)){
    header{background:var(--bg)}
  }

  .tabs{display:flex; gap:6px; padding:4px; background:var(--panel);
        border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow)}
  .tab{
    flex:1; appearance:none; border:0; background:transparent; color:var(--dim);
    font-family:inherit; font-size:15px; font-weight:700; letter-spacing:-.3px;
    padding:11px 4px; border-radius:11px; cursor:pointer;
    transition:background .16s ease, color .16s ease, transform .08s ease;
  }
  .tab:active{transform:scale(.97)}
  .tab[aria-selected="true"]{color:#fff}
  .tab[data-cat="soup"][aria-selected="true"]{background:var(--c-soup-key)}
  .tab[data-cat="kim"][aria-selected="true"]{background:var(--c-kim-key)}
  .tab[data-cat="side"][aria-selected="true"]{background:var(--c-side-key)}

  .toolbar{display:flex; align-items:center; gap:9px; margin-top:9px}
  .search{
    flex:1; position:relative;
  }
  .search input{
    width:100%; font-family:inherit; font-size:16px; color:var(--txt);
    background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:10px 34px 10px 34px; outline:none;
  }
  .search input::placeholder{color:var(--dim)}
  .search input:focus{border-color:var(--accent)}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none; appearance:none}
  .search .ico{position:absolute; left:11px; top:50%; transform:translateY(-50%);
               color:var(--dim); font-size:14px; pointer-events:none; line-height:1}
  .search .clear{
    position:absolute; right:4px; top:50%; transform:translateY(-50%);
    width:28px; height:28px; border:0; border-radius:50%; background:transparent;
    color:var(--dim); font-size:17px; line-height:1; cursor:pointer; display:none;
  }
  .search.has-value .clear{display:block}
  .count{font-size:13px; font-weight:700; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums}

  /* ── 뱃지 목록 ───────────────────────────────── */
  main{padding:14px 14px calc(var(--safe-b) + 28px)}
  .badges{display:flex; flex-wrap:wrap; gap:8px}
  .badge{
    font-size:14.5px; font-weight:600; letter-spacing:-.35px; line-height:1.2;
    padding:9px 13px; border-radius:999px; border:1px solid transparent;
    word-break:keep-all;
  }
  body[data-cat="soup"]{--accent:var(--c-soup-key)}
  body[data-cat="kim"] {--accent:var(--c-kim-key)}
  body[data-cat="side"]{--accent:var(--c-side-key)}
  body[data-cat="soup"] .badge{background:var(--c-soup-bg); border-color:var(--c-soup-line); color:var(--c-soup-txt)}
  body[data-cat="kim"]  .badge{background:var(--c-kim-bg);  border-color:var(--c-kim-line);  color:var(--c-kim-txt)}
  body[data-cat="side"] .badge{background:var(--c-side-bg); border-color:var(--c-side-line); color:var(--c-side-txt)}
  .badge mark{background:transparent; color:inherit; font-weight:900;
              text-decoration:underline; text-underline-offset:3px}

  .empty{padding:60px 0; text-align:center; color:var(--dim); font-size:15px}
</style>
</head>
<body data-cat="soup">

<header>
  <div class="tabs" role="tablist">
    <button class="tab" data-cat="soup" role="tab" aria-selected="true">국/찌개</button>
    <button class="tab" data-cat="kim"  role="tab" aria-selected="false">김치류</button>
    <button class="tab" data-cat="side" role="tab" aria-selected="false">반찬</button>
  </div>
  <div class="toolbar">
    <div class="search" id="search">
      <span class="ico">🔍</span>
      <input id="q" type="search" inputmode="search" enterkeyhint="search"
             autocomplete="off" autocorrect="off" spellcheck="false" placeholder="메뉴 검색">
      <button class="clear" id="clear" aria-label="지우기">✕</button>
    </div>
    <span class="count" id="count"></span>
  </div>
</header>

<main>
  <div class="badges" id="list"></div>
  <div class="empty" id="empty" hidden>검색 결과가 없어요</div>
</main>

const listEl  = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');
const qEl     = document.getElementById('q');
const searchEl= document.getElementById('search');
let cat = 'soup';

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const q = qEl.value.trim();
  const items = DATA[cat] || [];
  const hits = q ? items.filter(v => v.includes(q)) : items;

  countEl.textContent = q ? `${hits.length} / ${items.length}` : `${items.length}개`;
  searchEl.classList.toggle('has-value', q.length > 0);

  if (!hits.length){
    listEl.innerHTML = '';
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;

  const frag = [];
  for (const v of hits){
    let label = esc(v);
    if (q){
      const i = v.indexOf(q);
      label = esc(v.slice(0, i)) + '<mark>' + esc(v.slice(i, i + q.length)) + '</mark>' + esc(v.slice(i + q.length));
    }
    frag.push('<span class="badge">' + label + '</span>');
  }
  listEl.innerHTML = frag.join('');
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    cat = btn.dataset.cat;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b === btn)));
    document.body.dataset.cat = cat;
    render();
    window.scrollTo({top:0});
  });
});

qEl.addEventListener('input', render);
document.getElementById('clear').addEventListener('click', () => { qEl.value=''; qEl.focus(); render(); });

render();

/* http(s)로 열었을 때는 옆에 있는 원본 txt를 다시 읽어 최신 상태로 갱신 (file:// 은 그대로 내장 데이터 사용) */
if (location.protocol === 'http:' || location.protocol === 'https:'){
  const FILES = {soup:'국찌개.txt', kim:'김치류.txt', side:'반찬.txt'};
  Promise.all(Object.entries(FILES).map(([k, f]) =>
    fetch(encodeURIComponent(f)).then(r => r.ok ? r.text() : null).then(t => {
      if (t) DATA[k] = t.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    }).catch(() => {})
  )).then(render);
}
